name: Deploy to GitHub Pages

# Pushing to `main` publishes the site. `main` is also where the source lives, so a
# merge to main is both a source change and a deploy — which is the point: the site is
# the repository, and there is no second copy that can drift from the first.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, stated per job rather than granted globally. `pages: write` and
# `id-token: write` are what the deploy needs to mint a Pages deployment token; the
# build job needs neither and does not get them.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A second push supersedes an in-flight run rather than
# racing it, so Pages never ends up serving a half-applied build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `package.json` has no `packageManager` field, so the pnpm version is pinned here
      # instead of inferred. Local is 12.5.1; pinning it means CI cannot silently change
      # under a lockfile that was resolved by a different major.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      # 22 satisfies the project's own `engines: >=22.12.0`. It is not the same minor as
      # the local 24, deliberately: CI should prove the floor the project declares, not
      # the machine it happens to be built on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` runs `astro build`, which is also what the Zod schemas and the
      # content-layer types are checked by. A malformed frontmatter field fails HERE, on
      # the branch, instead of shipping.
      - run: pnpm build

      # The thirteen structural checks run against `dist/`, so they have to come after
      # the build. Failing the workflow here stops a bad build from ever reaching Pages,
      # which is the whole value of running them in CI rather than only locally.
      - run: pnpm verify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4